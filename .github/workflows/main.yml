name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build (compile all Python sources)
        run: python -m compileall -q app.py db.py services.py tests

      - name: Lint (flake8)
        run: flake8

  docker-build-and-test:
    name: Docker image assembly & containerized tests
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Docker image assembly (runtime image)
        run: docker build --target runtime --tag aceest-fitness:ci .

      - name: Docker image assembly (test image)
        run: docker build --target test --tag aceest-fitness:ci-test .

      - name: Automated testing - run Pytest inside the container
        run: docker run --rm aceest-fitness:ci-test pytest -q

      - name: Smoke test - runtime container serves /health
        run: |
          docker run -d --name aceest-smoke -p 5000:5000 aceest-fitness:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          docker logs aceest-smoke
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f aceest-smoke || true
